<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mascotas - Veterinaria La Mary</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-md-3 col-lg-2 p-0 admin-sidebar">
          <div class="p-3">
            <h2 class="h5 mb-4">Veterinaria La Mary</h2>

            <nav>
              <div class="mb-2">
                <a href="dashboard.html" class="d-block p-2 rounded">
                  <i class="bi bi-speedometer2"></i>
                  Dashboard
                </a>
              </div>
              <div class="mb-2">
                <a href="veterinarios.html" class="d-block p-2 rounded">
                  <i class="bi bi-person-badge"></i>
                  Veterinarios
                </a>
              </div>
              <div class="mb-2">
                <a href="mascotas.html" class="d-block p-2 rounded">
                  <i class="bi bi-heart"></i>
                  Mascotas
                </a>
              </div>
              <div class="mb-2">
                <a href="turnos.html" class="d-block p-2 rounded">
                  <i class="bi bi-calendar-check"></i>
                  Turnos
                </a>
              </div>
              <div class="mb-2">
                <a href="historia-clinica.html" class="d-block p-2 rounded">
                  <i class="bi bi-file-medical"></i>
                  Historia Clínica
                </a>
              </div>
            </nav>

            <hr />

            <button id="btnCerrarSesion" class="btn btn-outline-light w-100">
              <i class="bi bi-box-arrow-left"></i>
              Cerrar sesión
            </button>
          </div>
        </aside>

        <!-- CONTENIDO -->
        <main class="col-md-9 col-lg-10 p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="h2">Mascotas</h1>
              <p class="text-muted mb-0">Gestión de mascotas registradas</p>
            </div>

            <div class="d-flex gap-2">
              <button
                id="btnExportarMascotas"
                class="btn btn-outline-secondary"
              >
                <i class="bi bi-download"></i>
                Exportar
              </button>

              <button
                id="btnNuevaMascota"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalMascota"
              >
                <i class="bi bi-plus-lg"></i>
                Nueva mascota
              </button>
            </div>
          </div>

          <div class="table-container p-3">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Nombre</th>
                  <th>Dueño</th>
                  <th>Color</th>
                  <th>Edad</th>
                  <th>Peso actual</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>

              <!--
                TODO (encargado/a de Mascotas): en js/mascotas.js
                implementar renderizarTablaMascotas() que recorra
                obtenerMascotas() e inserte las filas <tr>, con botones
                que llamen a editarMascota(id) y eliminarMascotaUI(id).
                Para la foto, usar imagenMascota (Base64) en un <img>.
              -->
              <tbody id="tablaMascotas">
                <tr>
                  <td colspan="7" class="text-center text-muted">
                    No hay mascotas registradas.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- MODAL: Alta / Edición de Mascota -->
    <div class="modal fade" id="modalMascota" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formMascota">
            <div class="modal-header">
              <h2 class="h5 modal-title">Mascota</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="idMascota" />

              <div class="mb-3">
                <label for="nombreMascota" class="form-label">Nombre</label>
                <input
                  type="text"
                  id="nombreMascota"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="nombreDuenio" class="form-label">
                  Nombre del dueño
                </label>
                <input
                  type="text"
                  id="nombreDuenio"
                  class="form-control"
                  required
                />
              </div>

              <div class="row">
                <div class="col-6 mb-3">
                  <label for="color" class="form-label">Color</label>
                  <input type="text" id="color" class="form-control" required />
                </div>

                <div class="col-6 mb-3">
                  <label for="edad" class="form-label">Edad</label>
                  <input
                    type="number"
                    id="edad"
                    class="form-control"
                    min="0"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input
                  type="number"
                  step="0.01"
                  id="peso"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="imagenMascota" class="form-label"> Imagen </label>
                <!--
                  TODO (encargado/a de Mascotas): al seleccionar el
                  archivo, convertirlo a Base64 con FileReader y guardarlo
                  en el campo imagenMascota del objeto mascota.
                -->
                <input
                  type="file"
                  id="imagenMascota"
                  class="form-control"
                  accept="image/*"
                />
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/exportaciones.js"></script>
    <script src="../js/mascotas.js"></script>

    <script>
      protegerPagina();

      document
        .getElementById("btnCerrarSesion")
        .addEventListener("click", cerrarSesion);

      document
        .getElementById("btnExportarMascotas")
        .addEventListener("click", function () {
          exportarACSV(obtenerMascotas(), "mascotas");
        });
    </script>
  </body>
</html>
