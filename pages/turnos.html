<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Turnos - Veterinaria La Mary</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-md-3 col-lg-2 p-0 admin-sidebar">
          <div class="p-3">
            <h2 class="h5 mb-4">Veterinaria La Mary</h2>

            <nav>
              <div class="mb-2">
                <a href="dashboard.html" class="d-block p-2 rounded">
                  <i class="bi bi-speedometer2"></i>
                  Dashboard
                </a>
              </div>
              <div class="mb-2">
                <a href="veterinarios.html" class="d-block p-2 rounded">
                  <i class="bi bi-person-badge"></i>
                  Veterinarios
                </a>
              </div>
              <div class="mb-2">
                <a href="mascotas.html" class="d-block p-2 rounded">
                  <i class="bi bi-heart"></i>
                  Mascotas
                </a>
              </div>
              <div class="mb-2">
                <a href="turnos.html" class="d-block p-2 rounded">
                  <i class="bi bi-calendar-check"></i>
                  Turnos
                </a>
              </div>
              <div class="mb-2">
                <a href="historia-clinica.html" class="d-block p-2 rounded">
                  <i class="bi bi-file-medical"></i>
                  Historia Clínica
                </a>
              </div>
            </nav>

            <hr />

            <button id="btnCerrarSesion" class="btn btn-outline-light w-100">
              <i class="bi bi-box-arrow-left"></i>
              Cerrar sesión
            </button>
          </div>
        </aside>

        <!-- CONTENIDO -->
        <main class="col-md-9 col-lg-10 p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="h2">Turnos</h1>
              <p class="text-muted mb-0">Gestión de turnos agendados</p>
            </div>

            <div class="d-flex gap-2">
              <button id="btnExportarTurnos" class="btn btn-outline-secondary">
                <i class="bi bi-download"></i>
                Exportar
              </button>

              <button
                id="btnNuevoTurno"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalTurno"
              >
                <i class="bi bi-plus-lg"></i>
                Nuevo turno
              </button>
            </div>
          </div>

          <!--
            TODO (encargado/a de Turnos): agregar filtros por veterinario
            y por fecha arriba de la tabla, para facilitar la búsqueda
            del turno más adecuado (pedido en el enunciado).
          -->

          <div class="table-container p-3">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Fecha y hora</th>
                  <th>Mascota</th>
                  <th>Veterinario</th>
                  <th>Valor</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>

              <!--
                TODO (encargado/a de Turnos): en js/turnos.js implementar
                renderizarTablaTurnos() que recorra obtenerTurnos(),
                resuelva mascota/veterinario con buscarMascotaPorId() y
                buscarVeterinarioPorId(), y agregue botones para eliminar
                el turno y generar el comprobante en PDF con
                generarComprobantePDF(turno) (definida en js/reportes.js).
              -->
              <tbody id="tablaTurnos">
                <tr>
                  <td colspan="5" class="text-center text-muted">
                    No hay turnos registrados.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- MODAL: Alta de Turno -->
    <div class="modal fade" id="modalTurno" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formTurno">
            <div class="modal-header">
              <h2 class="h5 modal-title">Nuevo turno</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <div class="mb-3">
                <label for="fechaHoraTurno" class="form-label">
                  Fecha y hora
                </label>
                <input
                  type="datetime-local"
                  id="fechaHoraTurno"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="mascotaTurno" class="form-label">Mascota</label>
                <!--
                  TODO (encargado/a de Turnos): completar este <select>
                  dinámicamente con obtenerMascotas().
                -->
                <select id="mascotaTurno" class="form-select" required>
                  <option value="">Seleccionar mascota...</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="veterinarioTurno" class="form-label">
                  Veterinario
                </label>
                <!--
                  TODO (encargado/a de Turnos): completar este <select>
                  dinámicamente con obtenerVeterinarios(). El valor de la
                  consulta se toma del veterinario seleccionado.
                -->
                <select id="veterinarioTurno" class="form-select" required>
                  <option value="">Seleccionar veterinario...</option>
                </select>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/exportaciones.js"></script>
    <script src="../js/reportes.js"></script>
    <script src="../js/turnos.js"></script>

    <script>
      protegerPagina();

      document
        .getElementById("btnCerrarSesion")
        .addEventListener("click", cerrarSesion);

      document
        .getElementById("btnExportarTurnos")
        .addEventListener("click", function () {
          exportarACSV(obtenerTurnos(), "turnos");
        });
    </script>
  </body>
</html>
