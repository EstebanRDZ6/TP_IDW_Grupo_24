<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Acceso Administrador - Veterinaria La Mary</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <main class="container">
      <div
        class="row justify-content-center align-items-center"
        style="min-height: 100vh"
      >
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="card card-custom p-4">
            <div class="text-center mb-4">
              <i
                class="bi bi-person-circle"
                style="font-size: 4rem; color: var(--color-primary)"
              ></i>

              <h1 class="h3 mt-3">Acceso Administrador</h1>

              <p class="text-muted">Veterinaria La Mary</p>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="usuario" class="form-label"> Usuario </label>

                <input
                  type="text"
                  id="usuario"
                  name="usuario"
                  class="form-control"
                  required
                  autocomplete="username"
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label"> Contraseña </label>

                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  required
                  autocomplete="current-password"
                />
              </div>

              <div
                id="loginError"
                class="alert alert-danger d-none"
                role="alert"
              >
                Usuario o contraseña incorrectos.
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
              </button>
            </form>

            <div class="text-center mt-4">
              <a href="../index.html"> Volver al sitio </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>

    <script>
      const loginForm = document.getElementById("loginForm");

      const loginError = document.getElementById("loginError");

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();

        const password = document.getElementById("password").value;

        const resultado = iniciarSesion(usuario, password);

        if (resultado) {
          window.location.href = "dashboard.html";

          return;
        }

        loginError.classList.remove("d-none");
      });
    </script>
  </body>
</html>
