<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Acceso Administrador - Veterinaria La Mary</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/tema.js"></script>
  </head>

  <body>
    <main class="container">
      <div
        class="row justify-content-center align-items-center"
        style="min-height: 100vh"
      >
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="text-end mb-3">
            <button
              id="btnTema"
              type="button"
              class="btn btn-outline-secondary theme-toggle"
            >
              <i class="bi bi-moon"></i>
              Modo oscuro
            </button>
          </div>

          <div class="card card-custom p-4">
            <div class="text-center mb-4">
              <i
                class="bi bi-person-circle"
                style="font-size: 4rem; color: var(--color-primary)"
              ></i>

              <h1 class="h3 mt-3">Acceso Administrador</h1>

              <p class="text-muted">Veterinaria La Mary</p>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="usuario" class="form-label"> Usuario </label>

                <input
                  type="text"
                  id="usuario"
                  name="usuario"
                  class="form-control"
                  required
                  autocomplete="username"
                  placeholder="ej: emilys"
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label"> Contraseña </label>

                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  required
                  autocomplete="current-password"
                  placeholder="ej: emilyspass"
                />
              </div>

              <div
                id="loginError"
                class="alert alert-danger d-none"
                role="alert"
              >
                <span id="loginErrorText">Usuario o contraseña incorrectos.</span>
              </div>

              <button type="submit" class="btn btn-primary w-100" id="btnLogin">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
              </button>

              <div id="spinner" class="spinner-border d-none mt-3" role="status">
                <span class="visually-hidden">Cargando...</span>
              </div>
            </form>

            <div class="text-center mt-4">
              <p class="small text-muted">Prueba: emilys / emilyspass</p>
              <a href="../index.html"> Volver al sitio </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>

    <script>
      const loginForm = document.getElementById("loginForm");

      const loginError = document.getElementById("loginError");
      const loginErrorText = document.getElementById("loginErrorText");
      const btnLogin = document.getElementById("btnLogin");
      const spinner = document.getElementById("spinner");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();

        const password = document.getElementById("password").value;

        btnLogin.disabled = true;
        spinner.classList.remove("d-none");
        loginError.classList.add("d-none");

        const resultado = await iniciarSesion(usuario, password);

        btnLogin.disabled = false;
        spinner.classList.add("d-none");

        if (resultado) {
          window.location.href = "dashboard.html";

          return;
        }

        loginErrorText.textContent = "Usuario o contraseña incorrectos.";
        loginError.classList.remove("d-none");
      });
    </script>
  </body>
</html>
