<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contacto de Veterinaria La Mary" />

    <title>Contacto - Veterinaria La Mary</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand fw-bold" href="../index.html">
            Veterinaria La Mary
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarPrincipal"
            aria-controls="navbarPrincipal"
            aria-expanded="false"
            aria-label="Abrir navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarPrincipal">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="institucional.html">
                  Institucional
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contacto.html">Contacto</a>
              </li>
              <li class="nav-item">
                <a class="btn btn-primary ms-lg-2" href="login.html">
                  Administrador
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <h1 class="mb-4">Contacto</h1>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card card-custom p-4">
            <h2 class="h5 mb-3">Datos de contacto</h2>
            <ul class="list-unstyled text-muted">
              <li class="mb-2">
                <i class="bi bi-geo-alt text-primary"></i>
                <!--Completar con la dirección real. -->
                Calle Falsa 123, Entre Ríos
              </li>
              <li class="mb-2">
                <i class="bi bi-telephone text-primary"></i>
                <!--Completar con el teléfono real. -->
                (0343) 000-0000
              </li>
              <li class="mb-2">
                <i class="bi bi-envelope text-primary"></i>
                <!-- Completar con el email real. -->
                contacto@veterinarialamary.com
              </li>
            </ul>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card card-custom p-4">
            <h2 class="h5 mb-3">Enviar un mensaje</h2>

            <!--
              Equipo este formulario es solo informativo, no
              persiste datos. Hay que preguntarle al Profe si
              se puede conectar a un servicio de envío de correo externo.
            -->
            <form id="formContacto">
              <div class="mb-3">
                <label for="nombreContacto" class="form-label">Nombre</label>
                <input
                  type="text"
                  id="nombreContacto"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="emailContacto" class="form-label">Email</label>
                <input
                  type="email"
                  id="emailContacto"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="mensajeContacto" class="form-label">
                  Mensaje
                </label>
                <textarea
                  id="mensajeContacto"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Enviar
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer mt-5">
      <div class="container text-center py-4">
        <p class="mb-0">&copy; 2026 Veterinaria La Mary</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/utils.js"></script>

    <script>
      const formContacto = document.getElementById("formContacto");

      formContacto.addEventListener("submit", function (event) {
        event.preventDefault();
        mostrarAlerta("Mensaje enviado correctamente.", "success");
        formContacto.reset();
      });
    </script>
  </body>
</html>
