<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Veterinarios - Veterinaria La Mary</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-md-3 col-lg-2 p-0 admin-sidebar">
          <div class="p-3">
            <h2 class="h5 mb-4">Veterinaria La Mary</h2>

            <nav>
              <div class="mb-2">
                <a href="dashboard.html" class="d-block p-2 rounded">
                  <i class="bi bi-speedometer2"></i>
                  Dashboard
                </a>
              </div>
              <div class="mb-2">
                <a href="veterinarios.html" class="d-block p-2 rounded">
                  <i class="bi bi-person-badge"></i>
                  Veterinarios
                </a>
              </div>
              <div class="mb-2">
                <a href="mascotas.html" class="d-block p-2 rounded">
                  <i class="bi bi-heart"></i>
                  Mascotas
                </a>
              </div>
              <div class="mb-2">
                <a href="turnos.html" class="d-block p-2 rounded">
                  <i class="bi bi-calendar-check"></i>
                  Turnos
                </a>
              </div>
              <div class="mb-2">
                <a href="historia-clinica.html" class="d-block p-2 rounded">
                  <i class="bi bi-file-medical"></i>
                  Historia Clínica
                </a>
              </div>
            </nav>

            <hr />

            <button id="btnCerrarSesion" class="btn btn-outline-light w-100">
              <i class="bi bi-box-arrow-left"></i>
              Cerrar sesión
            </button>
          </div>
        </aside>

        <!-- CONTENIDO -->
        <main class="col-md-9 col-lg-10 p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="h2">Veterinarios</h1>
              <p class="text-muted mb-0">Gestión de profesionales</p>
            </div>

            <div class="d-flex gap-2">
              <button
                id="btnExportarVeterinarios"
                class="btn btn-outline-secondary"
              >
                <i class="bi bi-download"></i>
                Exportar
              </button>

              <button
                id="btnNuevoVeterinario"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalVeterinario"
              >
                <i class="bi bi-plus-lg"></i>
                Nuevo veterinario
              </button>
            </div>
          </div>

          <div class="table-container p-3">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Matrícula</th>
                  <th>Nombre</th>
                  <th>Especialización</th>
                  <th>Valor consulta</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>

              <!--
                TODO (encargado/a de Veterinarios): en js/veterinarios.js
                implementar renderizarTablaVeterinarios() que recorra
                obtenerVeterinarios() e inserte las filas <tr> acá dentro,
                con botones de editar/eliminar que llamen a
                editarVeterinario(id) y eliminarVeterinarioUI(id).
              -->
              <tbody id="tablaVeterinarios">
                <tr>
                  <td colspan="5" class="text-center text-muted">
                    No hay veterinarios registrados.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- MODAL: Alta / Edición de Veterinario -->
    <div class="modal fade" id="modalVeterinario" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formVeterinario">
            <div class="modal-header">
              <h2 class="h5 modal-title">Veterinario</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="idVeterinario" />

              <div class="mb-3">
                <label for="matricula" class="form-label">Matrícula</label>
                <input
                  type="number"
                  id="matricula"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="nombreVeterinario" class="form-label">
                  Nombre
                </label>
                <input
                  type="text"
                  id="nombreVeterinario"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="especializacion" class="form-label">
                  Especialización
                </label>
                <input
                  type="text"
                  id="especializacion"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="valorConsulta" class="form-label">
                  Valor de consulta
                </label>
                <input
                  type="number"
                  step="0.01"
                  id="valorConsulta"
                  class="form-control"
                  required
                />
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/exportaciones.js"></script>
    <script src="../js/veterinarios.js"></script>

    <script>
      protegerPagina();

      document
        .getElementById("btnCerrarSesion")
        .addEventListener("click", cerrarSesion);

      document
        .getElementById("btnExportarVeterinarios")
        .addEventListener("click", function () {
          exportarACSV(obtenerVeterinarios(), "veterinarios");
        });
    </script>
  </body>
</html>
